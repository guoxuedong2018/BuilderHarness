<title id="title">BuilderHarness · 产品架构</title>
<desc id="description">浏览器评审与 Studio、命令行和 Agent 宿主连接本地 Vite 集成、共享 CLI 管线及宿主桥接。各入口使用宿主仓库中的规格、应用源码、批注 JSON 和 Markdown 内容。MCP 只读。媒体工具和发布目的地是可选集成。图中是组件分组，不是需要独立部署的服务。</desc>

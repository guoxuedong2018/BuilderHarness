<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BuilderHarness · 待决清单</title>
<style>
  :root { color-scheme: light dark; font: 16px/1.55 system-ui; }
  body { max-width: 48rem; margin: 2rem auto; padding: 0 1rem; }
  article { border: 1px solid GrayText; border-radius: .5rem; padding: 1rem; margin: .75rem 0; }
  h3 { margin: 0; }
  p { white-space: pre-wrap; }
  label { display: block; margin: .65rem 0; }
  input, textarea, select, button { font: inherit; }
  input, textarea { width: 100%; box-sizing: border-box; }
</style>
<h1>待决清单</h1>
<p id="summary" role="status">正在读取需求…</p>
<main id="items"></main>
<script type="module">
  const summary = document.querySelector("#summary");
  const main = document.querySelector("#items");
  const key = new URLSearchParams(location.search).get("key");
  const labels = { open: "待决定", recorded: "已记录", submitted: "已提交，待回写", "needs-review": "内容变化，待复核" };
  const append = (parent, tag, text) => {
    const element = document.createElement(tag);
    element.textContent = text;
    parent.append(element);
    return element;
  };
  async function load() {
    try {
      const response = await fetch("/__proto_review/decisions/data" + (key ? "?key=" + encodeURIComponent(key) : ""));
      const result = await response.json();
      if (!response.ok) throw new Error(result.error);
      main.replaceChildren();
      summary.textContent = result.features.length ? "结论提交后，由 Agent 回写需求规格。" : "当前没有待决清单。";
      if (key) {
        const link = append(main, "a", "查看全部需求");
        link.href = "/__proto_review/decisions";
      }
      for (const { key, items } of result.features) {
        append(main, "h2", key);
        for (const item of items) {
          const article = append(main, "article", "");
          append(article, "h3", item.id + " · " + labels[item.status]);
          append(article, "p", item.question);
          if (item.conclusion) append(article, "p", "已记录：" + item.conclusion.replace(/<!--[^]*?-->/g, "").trim());
          if (item.submission && item.status !== "recorded") append(article, "p", "最近提交：" + item.submission.author + " · " + item.submission.body);
          if (item.status === "recorded" || item.status === "submitted") continue;
          const form = append(article, "form", "");
          const action = append(append(form, "label", "处理方式 "), "select", "");
          action.name = "action";
          for (const [value, label] of [["confirm", "确认"], ["return", "打回"], ["answer", "补充答复"]]) {
            append(action, "option", label).value = value;
          }
          for (const [name, label, tag, required] of [
            ["author", "确认人", "input", true], ["body", "结论或修改意见", "textarea", true], ["source", "来源（补充答复时必填）", "input", false],
          ]) {
            const field = append(append(form, "label", label), tag, "");
            field.name = name;
            field.required = required;
          }
          const button = append(form, "button", "提交");
          const status = append(form, "p", "");
          status.setAttribute("role", "status");
          form.addEventListener("submit", async (event) => {
            event.preventDefault();
            button.disabled = true;
            try {
              const body = Object.fromEntries(new FormData(form));
              const response = await fetch("/__proto_review/decisions/submit", {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ ...body, key, item: item.id, version: item.version }),
              });
              const result = await response.json();
              if (!response.ok) throw new Error(result.error);
              await load();
            } catch (error) {
              status.textContent = error.message;
              button.disabled = false;
            }
          });
        }
      }
    } catch (error) {
      summary.textContent = error.message;
    }
  }
  await load();
</script>
